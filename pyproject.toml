[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-medallion-starter"
version = "0.1.0"
description = "Starter de arquitetura Medallion (Bronze, Silver, Gold) para Microsoft Fabric, com dados sintéticos de frequência escolar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Victor Martins da Silva" }]
dependencies = ["pandas>=2.1", "pyarrow>=14", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
